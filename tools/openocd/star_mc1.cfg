# STAR-MC1 (Arm China, Cortex-M33 compatible) on the Action 104 / Pac-Man
# consoles. Pico debugprobe / CMSIS-DAP. There is no on-chip flash
# algorithm — the SPI flash is behind the MPI at 0x52005000; use
# tools/flash_openocd.py (RAM writer) to program it.
#
# nRESET is not wired out. Connect-under-reset is not available; a hung
# image is recovered by power-cycling into tools/rescue_openocd.py.

source [find interface/cmsis-dap.cfg]
transport select swd

adapter speed 100

source [find target/swj-dp.tcl]

set _CHIPNAME star_mc1
set _ENDIAN little

# Arm China STAR-MC1 SW-DP IDR (JEP106 0x75). CLASS=0 AHB5 MEM-AP is at
# AP#0 (IDR 0x1aeb0015); OpenOCD's auto-scan looks for ARM CLASS=8 AHB
# and misses it unless -ap-num is forced.
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x1be12aeb
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 0

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x10000 -work-area-backup 0

reset_config none
cortex_m reset_config sysresetreq
